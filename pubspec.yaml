name: mjcc
description: "MOROWALI JUARA COMMAND CENTER (MJCC) - Flutter Android client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^11.1.1
  provider: ^6.1.2
  intl: ^0.20.2
  fl_chart: ^0.69.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# - package_info_plus 10.2.0 adds Flutter built-in Kotlin support which removes
#   the "plugin applies Kotlin Gradle Plugin (KGP)" warning/blocker on Android
#   builds (only applies KGP when AGP < 9; our app uses AGP 9.1.0).
# - flutter_secure_storage 11.x raises minSdk to 24 (ok) and depends on
#   win32 ^6, which package_info_plus 10.2.0 also requires. It removes the
#   deprecated `encryptedSharedPreferences` option; SecureStorage now uses the
#   default AndroidOptions (RSA OAEP + AES-GCM) which auto-migrates v9 data.
dependency_overrides:
  package_info_plus: ^10.2.0
  flutter_secure_storage: ^11.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
    - assets/icons/
